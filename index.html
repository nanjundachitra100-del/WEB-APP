
<!DOCTYPE html>
<html>
<head>
    <title>Student Page</title>

    <style>
        body {
            background-color: lightblue;
            text-align: center;
            margin-top: 50px;
        }

        h1 {
            color:blue;
            font-size: 45px;
        }

        h2 {
            color: green;
        }

        p {
            color: black;
            font-size: 20px;
        }

        img {
            width: 400px;
            height: 250px;
            border: 3px solid darkblue;
            border-radius: 10px;
        }

        table {
            margin: auto;
            border-collapse: collapse;
            width: 50%;
            background-color: white;
        }

        th, td {
            border: 2px solid darkblue;
            padding: 12px;
        }

        th {
            background-color: darkblue;
            color: white;
        }

        a {
            background-color: darkblue;
            color: white;
            font-size: 20px;
            padding: 10px;
            text-decoration: none;
        }

        a:hover {
            background-color: white;
        }
    </style>
</head>

<body>

    <h1>Student Page</h1>

    <h2>Welcome to My School!</h2>

    <p>Hello, my name is Chitrashree.</p>

    <br>

    <img src="https://placehold.co/600x350/87CEEB/000000?text=My+School"
         alt="School Image">

    <br><br>

    <table>
        <tr>
            <th>Student Detail</th>
            <th>Information</th>
        </tr>

        <tr>
            <td>Name</td>
            <td>Chitrashree</td>
        </tr>

        <tr>
            <td>Role</td>
            <td>Student</td>
        </tr>
    </table>

    <br><br>

    <a href="https://www.google.com/" target="_blank">
        Visit Google
    </a>

</body>
</html>
