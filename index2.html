
<!DOCTYPE html>
<html>
<head>
    <title>My Colourful Page</title>

    <style>
        body {
            background-color: #f0f4ff;
            font-family: Arial, sans-serif;
        }

        h1 {
            color: white;
            background-color: #6c5ce7;
            text-align: center;
            padding: 20px;
            border-radius: 15px;
        }

        h2 {
            color: #e84393;
            text-align: center;
        }

        p {
            color: #2d3436;
            background-color: #dfe6e9;
            margin: 25px;
            width: 250px;
            padding: 20px;
            border: dotted 4px #0984e3;
            text-align: center;
            border-radius: 15px;
        }

        .para1 {
            background-color: #ffeaa7;
            border: solid 3px #fdcb6e;
        }

        .para2 {
            background-color: #fab1a0;
            border: dashed 3px #e17055;
        }

        .para3 {
            background-color: #a29bfe;
            border: double 5px #6c5ce7;
        }

        a {
            color: #0984e3;
            font-size: 20px;
            text-decoration: none;
        }

        a:hover {
            color: #e84393;
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <h1 title="I'm a tooltip">Welcome to My Webpage!</h1>

    <h2>Learning HTML and CSS</h2>

    <p class="para1">Paragraph 1: Hello! Welcome to my page.</p>

    <p class="para2">Paragraph 2: I am learning web development.</p>

    <p class="para3">Paragraph 3: H<sub>2</sub>O is the chemical formula for water.</p>

    <h2>Useful Website</h2>

    <p>
        <a href="https://www.google.com/" target="_blank">
            Visit Google
        </a>
    </p>

</body>
</html>
